annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Schedule green clearance intervals along path of approaching emergency
  vehicle GPS telemetry.
input_schema:
  additionalProperties: false
  properties:
    corridor_id:
      type: string
    vehicle_id:
      type: string
  required:
  - corridor_id
  - vehicle_id
  type: object
name: trigger-corridor-preemption
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
