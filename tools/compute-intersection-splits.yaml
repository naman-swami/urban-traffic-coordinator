annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate Webster cycle lengths and green splits from inductive loop
  volume and occupancy sensors.
input_schema:
  additionalProperties: false
  properties:
    intersection_id:
      type: string
    volume_vph:
      type: number
  required:
  - intersection_id
  - volume_vph
  type: object
name: compute-intersection-splits
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
